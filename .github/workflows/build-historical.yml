name: Build historical data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build historical.json
        run: python3 scripts/build_historical.py
      - name: Commit historical.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/historical.json
          git diff --cached --quiet || git commit -m "Update historical data"
          git push
