name: Save weekly odds snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 2"
    - cron: "0 16 * * 6"

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/save_odds.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Save weekly odds snapshot"
          git push
