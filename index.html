<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Picks Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>NFL Picks Helper</h1>
      <p class="subtitle">Current week schedule + lines</p>
    </header>

    <section class="controls">
      <label for="week-select">Select Week:</label>
      <select id="week-select">
        <option value="">Loading weeks...</option>
      </select>
      <button id="load-odds-btn" type="button">Load live odds</button>
      <button id="download-snapshot-btn" type="button">Download snapshot</button>
      <label class="import-label">
        Import snapshot
        <input id="import-snapshot-input" type="file" accept=".csv">
      </label>
    </section>

    <section class="status-box">
      <p id="status-message">Loading data...</p>
      <p id="record-message"></p>
    </section>

    <section id="games-container" class="games-container">
      <!-- Game cards will appear here -->
    </section>

    <footer>
      <p>Built with help from Grok • Data for informational purposes only</p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
