<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Picks Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>NFL Picks Helper</h1>
      <p class="subtitle">Historical data + analysis for better football picks</p>
    </header>

    <section class="controls">
      <label for="week-select">Select Week:</label>
      <select id="week-select">
        <option value="">Loading weeks...</option>
      </select>
    </section>

    <section class="status-box">
      <p id="status-message">Loading data...</p>
    </section>

    <section class="table-section">
      <div class="table-wrapper">
        <table id="games-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Away</th>
              <th>Score</th>
              <th>Home</th>
              <th>Score</th>
              <th>Spread</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="games-body">
            <!-- Games will appear here -->
          </tbody>
        </table>
      </div>
    </section>

    <footer>
      <p>Built with help from Grok • Data for informational purposes only</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>>
