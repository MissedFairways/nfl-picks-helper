<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Picks Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>NFL Picks Helper</h1>
      <p class="subtitle">Current week schedule + lines</p>
    </header>

    <section class="controls">
      <label for="week-select">Select Week:</label>
      <select id="week-select">
        <option value="">Loading weeks...</option>
      </select>
    </section>

    <section class="status-box">
      <p id="status-message">Loading data...</p>
    </section>

    <section id="games-container" class="games-container">
  <!-- Game cards will appear here -->
</section>

<section class="edge-insights">
  <h2>Edge Insights (Historical Sample)</h2>
  <div id="edge-box">
    <p>Loading edge stats...</p>
  </div>
</section>

    <footer>
      <p>Built with help from Grok • Data for informational purposes only</p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
